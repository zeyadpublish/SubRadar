<!DOCTYPE html>
<html>
<head>
    <title>Sub Radar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-wrapper">
        <div class="login-box">
            <h2>Sub Radar Access</h2>
            <label>Username / Email:</label><br>
            <input type="text" id="loginUser" class="input-fld"><br><br>
            <label>Password:</label><br>
            <input type="password" id="loginPass" class="input-fld"><br><br>
            <button id="enterBtn" onclick="doLogin()">SIGN IN / UP</button>
        </div>
    </div>
    <div id="app-wrapper" style="display: none;">
        <div id="header-box">
            <h1>Sub Radar</h1>
            <button onclick="signOut()">SIGN OUT</button>
            <div id="money-box">
                <select id="currSelect" onchange="changeCurrency()">
                    <option value="USD">USD</option>
                    <option value="AED">AED</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="SAR">SAR</option>
                    <option value="EGP">EGP</option>
                </select>
                Total Burn: <b id="totalburn">0.00</b> <span id="currLabel">USD</span>
            </div>
        </div>
        <div class="container">
            <div class="left-panel">
                <h2>Add Sub</h2>
                <label>Service Name:</label><br>
                <input type="text" id="subName" class="input-fld" placeholder="ex: Shopify"><br>
                <label>Price (Base USD):</label><br>
                <input type="number" id="subPrice" class="input-fld"><br>
                <label>Billing Date:</label><br>
                <input type="date" id="subDate" class="input-fld"><br>
                <button id="saveBtn" onclick="addSub()">SAVE NOW</button>
                <p id="errorText"></p>
            </div>
            <div class="right-panel">
                <h2>My List</h2>
                <div id="the-list"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
